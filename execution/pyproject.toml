[project]
name = "mosaic-execution"
version = "0.1.0"
description = "mOSaic execution layer: Docker sandboxes, Playwright browser, file ops, MCP connectors, mock Jira, artifacts"
requires-python = ">=3.12"
dependencies = [
    "mosaic-contracts",
    "docker>=7",
    "httpx>=0.27",
    "playwright>=1.45",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
mosaic-mock-jira = "mosaic_execution.connectors.jira_mock:main"

[tool.uv.sources]
mosaic-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaic_execution"]
