<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-labelledby="t d">
  <title id="t">Measured on the demo laptop</title>
  <desc id="d">A full Apollo investigation in about 51 seconds with 5 agents, 1 human approval, 3 cited root causes, memories invalidated 0.2 seconds after a source edit, 16 of 16 components real, all on an 8 GB laptop GPU.</desc>
  <defs>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .v { font-size: 44px; font-weight: 800; }
      .u { font-size: 20px; font-weight: 700; }
      .l { font-size: 14px; fill: #A9B3BF; }
    </style>
  </defs>
  <rect width="1280" height="200" rx="24" fill="#0D1117"/>
  <g class="t">
    <text x="48" y="44" font-size="13" font-weight="800" letter-spacing="1.6" fill="#5B6675">MEASURED ON THE DEMO LAPTOP · RTX 5070 LAPTOP GPU, 8 GB · qwen2.5:7b-instruct</text>
    <g transform="translate(48 70)">
      <rect width="170" height="104" rx="14" fill="#103A35"/>
      <text x="18" y="56" class="v" fill="#5FDCC8">51<tspan class="u"> s</tspan></text><text x="18" y="84" class="l">goal to recovery plan</text>
    </g>
    <g transform="translate(232 70)">
      <rect width="170" height="104" rx="14" fill="#2A2342"/>
      <text x="18" y="56" class="v" fill="#C3B8F5">5</text><text x="18" y="84" class="l">agent processes</text>
    </g>
    <g transform="translate(416 70)">
      <rect width="170" height="104" rx="14" fill="#3A2A0E"/>
      <text x="18" y="56" class="v" fill="#F0C06A">1</text><text x="18" y="84" class="l">human approval</text>
    </g>
    <g transform="translate(600 70)">
      <rect width="170" height="104" rx="14" fill="#142A45"/>
      <text x="18" y="56" class="v" fill="#8DB5EE">3</text><text x="18" y="84" class="l">cited root causes</text>
    </g>
    <g transform="translate(784 70)">
      <rect width="170" height="104" rx="14" fill="#3D1618"/>
      <text x="18" y="56" class="v" fill="#F29090">0.2<tspan class="u"> s</tspan></text><text x="18" y="84" class="l">stale-memory alert</text>
    </g>
    <g transform="translate(968 70)">
      <rect width="264" height="104" rx="14" fill="#1F3A1A"/>
      <text x="18" y="56" class="v" fill="#7FD68C">16/16</text><text x="18" y="84" class="l">components real · 0 cloud calls</text>
    </g>
  </g>
</svg>
