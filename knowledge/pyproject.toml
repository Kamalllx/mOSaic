[project]
name = "mosaic-knowledge"
version = "0.1.0"
description = "mOSaic knowledge fabric (OKF, ingestion, hybrid retrieval, graph, knowledge filesystem) and memory manager"
requires-python = ">=3.12"
dependencies = [
    "mosaic-contracts",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "networkx>=3.3",
    "watchfiles>=0.22",
    "markdown-it-py>=3",
    "typer>=0.12",
]

[project.optional-dependencies]
ingest = ["markitdown>=0.1"]  # pdf/docx/pptx -> markdown

[project.scripts]
mosaic-okf = "mosaic_knowledge.cli:main"

[tool.uv.sources]
mosaic-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaic_knowledge"]
