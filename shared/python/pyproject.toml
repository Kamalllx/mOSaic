[project]
name = "mosaic-contracts"
version = "0.1.0"
description = "mOSaic shared contracts: schemas, interfaces, fakes, contract tests, gateway API spec"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mosaic-mock-gateway = "mosaic_contracts.api.mock_gateway:main"
mosaic-export-contracts = "mosaic_contracts.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaic_contracts"]
