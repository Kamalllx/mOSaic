[project]
name = "mosaic-models"
version = "0.1.0"
description = "mOSaic model runtime: providers (Ollama, llama.cpp, vLLM, approved remote), policy-driven router, GPU monitor"
requires-python = ">=3.12"
dependencies = [
    "mosaic-contracts",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.22",  # P3: validate structured model output
    "psutil>=5.9",       # P4: resource probe
]

[tool.uv.sources]
mosaic-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaic_models"]
