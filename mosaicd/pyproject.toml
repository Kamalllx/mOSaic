[project]
name = "mosaicd"
version = "0.1.0"
description = "mOSaic server process: composition root that wires all work splits together"
requires-python = ">=3.12"
dependencies = [
    "mosaic-contracts[api]",
    "mosaic-kernel",
    "mosaic-knowledge",
    "mosaic-agents",
    "mosaic-models",
    "mosaic-execution",
]

[project.scripts]
mosaicd = "mosaicd.main:main"

[tool.uv.sources]
mosaic-contracts = { workspace = true }
mosaic-kernel = { workspace = true }
mosaic-knowledge = { workspace = true }
mosaic-agents = { workspace = true }
mosaic-models = { workspace = true }
mosaic-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaicd"]
