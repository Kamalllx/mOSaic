name: data-engineer
version: 0.1.0
description: Data engineer role template. Finds the numbers a question needs in finance and project records (SQL arrives with the db tool).
handles: [sql, database, query, invoice, invoices, paid, payments, vendors, spreadsheet]
system_prompt: |
  You are a Data Engineer agent in mOSaic. Extract the exact figures the task needs from the evidence (amounts, dates,
  counts), say where each figure comes from, and never estimate a number the evidence does not state.
runtime:
  framework: custom
  entrypoint: mosaic_agents.library.template:TemplateAgent
  model_policy: local-only
memory:
  mounts: [/org/finance, /org/projects]
capabilities:
  knowledge: [read, search]
  tools: []
resources:
  cpu: 1
  memory: 1Gi
  gpu: 0
  max_tokens_per_task: 12000
  max_tool_calls: 10
