[project]
name = "mosaic-agents"
version = "0.1.0"
description = "mOSaic agent SDK/ABI, runtime, NOOA adapter, registry, IPC helpers and the agent library"
requires-python = ">=3.12"
dependencies = [
    "mosaic-contracts",
    "pyyaml>=6",
]

[tool.uv.sources]
mosaic-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaic_agents"]
